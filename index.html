<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f6269"><title>特典スピードテスト</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#18323a;background:#eef5f5}*{box-sizing:border-box}body{margin:0;min-height:100dvh}.wrap{max-width:560px;margin:auto;padding:24px 18px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{font-weight:800;color:#0d6269;font-size:15px}.pill{font-size:12px;background:#d9eded;color:#0b6068;border-radius:100px;padding:6px 12px;font-weight:700}.card{background:white;border:1px solid #d9e7e8;border-radius:22px;padding:24px;box-shadow:0 10px 30px #18444a0c}.hide{display:none!important}h1{font-size:26px;letter-spacing:-.03em;margin:4px 0 12px}p{line-height:1.7;color:#60747a}.small{font-size:13px}.field{display:flex;align-items:center;gap:12px;margin:24px 0 8px}.field input{width:125px;padding:12px;font-size:22px;font-weight:700;border:1px solid #a5c6c8;border-radius:12px;text-align:center;color:#163b40}.btn{display:block;width:100%;border:0;border-radius:14px;padding:17px 15px;font-size:17px;font-weight:750;cursor:pointer;touch-action:manipulation}.primary{background:#106b72;color:white;margin-top:24px}.secondary{background:#e7f2f2;color:#185b61}.muted{background:transparent;color:#73868a;font-size:14px;margin-top:14px;padding:12px}.stats{display:flex;justify-content:space-between;align-items:center;gap:12px}.timer{font-variant-numeric:tabular-nums;font-size:32px;font-weight:800;color:#0e656d}.progress{height:9px;border-radius:99px;background:#e3eeee;overflow:hidden;margin:16px 0 30px}.progress>div{height:100%;background:#13a0a0;width:100%;transition:width .25s linear}.prompt{background:#f2f8f8;border-radius:16px;text-align:center;padding:29px 12px;margin:0 0 18px;font-size:21px;font-weight:800;line-height:1.55}.choices{display:grid;gap:11px}.choice{border:1.5px solid #c7dddd;background:white;color:#19454a;text-align:left;padding:17px 18px}.choice:active{background:#d7eded}.results{margin-top:20px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.metric{background:#f1f7f7;border-radius:12px;padding:14px}.metric span{display:block;color:#647a80;font-size:12px}.metric strong{display:block;font-size:21px;margin-top:5px;font-variant-numeric:tabular-nums}.review{padding:15px 0;border-bottom:1px solid #e4eded}.reviewhead{display:flex;align-items:center;gap:9px;font-weight:750;line-height:1.5}.mark{font-weight:900;color:#16856e}.mark.bad{color:#d06150}.mark.none{color:#8a9699}.review p{margin:6px 0 0;font-size:13px;line-height:1.65}.note{font-size:12px;color:#71848a;margin-top:18px}button:focus-visible,input:focus-visible{outline:3px solid #35aaa9;outline-offset:3px}@media(max-width:370px){.wrap{padding:15px 12px}.card{padding:18px}.prompt{font-size:19px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">教室長試験対策 ｜ 特典スピードテスト</div><span class="pill" id="status">自主練習</span></div><section class="card" id="start"><h1>スピードテスト</h1><p>全 <strong id="total">14</strong> 問をランダムに出題します。正解は最後にまとめて確認できます。</p><label class="field"><strong>制限時間</strong><input type="number" id="limit" min="1" max="86400" step="1" value="60" inputmode="numeric"><span>秒</span></label><p class="small">解答すると自動で次の問題に進みます。</p><button class="btn primary" id="startBtn">テスト開始</button><p class="note">履歴は保存されません。問題・正解は提供されたExcelファイルの登録内容を使用しています。</p></section><section class="card hide" id="play"><div class="stats"><strong id="count"></strong><span class="timer" id="clock">01:00</span></div><div class="progress"><div id="bar"></div></div><div class="prompt" id="prompt"></div><div class="choices" id="choices"></div><button class="btn muted" id="stopBtn">テスト中止</button></section><section class="card hide" id="finish"><h1>テスト結果</h1><p id="reason"></p><div class="summary"><div class="metric"><span>正解数</span><strong id="score"></strong></div><div class="metric"><span>正答率</span><strong id="accuracy"></strong></div><div class="metric"><span>所要時間</span><strong id="elapsed"></strong></div><div class="metric"><span>平均解答時間</span><strong id="average"></strong></div></div><button class="btn primary" id="retry">もう一度挑戦</button><div class="results" id="review"></div></section></main><script>
'use strict';const QUESTIONS=[{"category": "紹介特典", "item": "入会金", "answer": 2}, {"category": "紹介特典", "item": "年会費", "answer": 4}, {"category": "紹介特典", "item": "授業料", "answer": 4}, {"category": "転塾特典", "item": "入会金", "answer": 1}, {"category": "転塾特典", "item": "年会費", "answer": 4}, {"category": "転塾特典", "item": "授業料", "answer": 4}, {"category": "転塾特典", "item": "教材費", "answer": 1}, {"category": "兄弟姉妹特典", "item": "入会金(1人目)", "answer": 4}, {"category": "兄弟姉妹特典", "item": "入会金(2人目以降)", "answer": 1}, {"category": "兄弟姉妹特典", "item": "年会費", "answer": 1}, {"category": "兄弟姉妹特典", "item": "授業料", "answer": 3}, {"category": "ひとり親家庭割引", "item": "入会金", "answer": 2}, {"category": "ひとり親家庭割引", "item": "年会費", "answer": 4}, {"category": "ひとり親家庭割引", "item": "授業料", "answer": 3}];const LABELS=['未解答','① 全額免除','② 半額免除','③ 5％割引','④ 割引なし'];const $=id=>document.getElementById(id);let deck=[],answers=[],index=0,deadline=0,startTime=0,seconds=60,ticker=null,active=false;
$('total').textContent=QUESTIONS.length;
function show(id){for(const s of ['start','play','finish'])$(s).classList.toggle('hide',s!==id);$('status').textContent=id==='play'?'実施中':id==='finish'?'終了':'自主練習'}
function clearTimer(){if(ticker!==null){clearInterval(ticker);ticker=null}}
function remaining(){return Math.max(0,Math.ceil((deadline-performance.now())/1000))}
function clock(){if(!active)return;const ms=Math.max(0,deadline-performance.now()),rem=Math.ceil(ms/1000);$('clock').textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');$('bar').style.width=(100*ms/(seconds*1000))+'%';if(ms<=0)end('時間切れ')}
function next(){if(!active)return;if(performance.now()>=deadline){end('時間切れ');return}if(index>=deck.length){end('全問解答');return}const x=deck[index];$('count').textContent=`第 ${index+1} 問 / 全 ${deck.length} 問`;$('prompt').textContent=`${x.category}の${x.item}は？`;$('choices').replaceChildren();for(let i=1;i<=4;i++){const b=document.createElement('button');b.className='btn choice';b.textContent=LABELS[i];b.addEventListener('click',()=>answer(i));$('choices').appendChild(b)}clock()}
function answer(n){if(!active)return;if(performance.now()>=deadline){end('時間切れ');return}answers[index]=n;index++;next()}
function start(){const n=Number($('limit').value);if(!Number.isInteger(n)||n<1||n>86400){alert('制限時間は1～86400の整数秒で入力してください。');return}seconds=n;deck=QUESTIONS.map(x=>({...x}));for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}answers=Array(deck.length).fill(0);index=0;startTime=performance.now();deadline=startTime+seconds*1000;active=true;show('play');next();ticker=setInterval(clock,150)}
function end(reason){if(!active)return;const duration=Math.min(seconds,(performance.now()-startTime)/1000);active=false;clearTimer();const correct=deck.reduce((s,q,i)=>s+(answers[i]===q.answer?1:0),0),answered=answers.filter(Boolean).length;show('finish');$('reason').textContent=reason;$('score').textContent=`${correct} / ${deck.length}`;$('accuracy').textContent=(100*correct/deck.length).toFixed(1)+'%';$('elapsed').textContent=duration.toFixed(1)+'秒';$('average').textContent=answered?(duration/answered).toFixed(1)+'秒':'--';$('review').replaceChildren();deck.forEach((q,i)=>{const ans=answers[i],ok=ans===q.answer;const div=document.createElement('div');div.className='review';const head=document.createElement('div');head.className='reviewhead';const mark=document.createElement('span');mark.className='mark '+(ans?(ok?'':'bad'):'none');mark.textContent=ans?(ok?'○':'×'):'－';const title=document.createElement('span');title.textContent=`${i+1}. ${q.category}の${q.item}`;head.append(mark,title);const detail=document.createElement('p');detail.textContent=`あなたの解答：${LABELS[ans]}　／　正解：${LABELS[q.answer]}`;div.append(head,detail);$('review').append(div)})}
function stop(){if(!active)return;if(!confirm('テストを中止しますか？\n現在の解答記録は破棄されます。'))return;active=false;clearTimer();deck=[];answers=[];show('start')}
$('startBtn').addEventListener('click',start);$('stopBtn').addEventListener('click',stop);$('retry').addEventListener('click',()=>show('start'));document.addEventListener('keydown',e=>{if(!active||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;if(['1','2','3','4'].includes(e.key)){e.preventDefault();answer(Number(e.key))}});document.addEventListener('visibilitychange',()=>{if(active&&!document.hidden)clock()});
</script></body></html>
